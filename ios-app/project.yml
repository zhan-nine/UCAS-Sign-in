name: Qingxin
options:
  bundleIdPrefix: com.vel.qingxin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  QingxinCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    APP_GROUP_IDENTIFIER: group.com.vel.qingxin
    QINGXIN_BUNDLE_ID: com.vel.qingxin
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  Qingxin:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../LICENSES/AGPL-3.0.txt
        buildPhase: resources
    dependencies:
      - package: QingxinCore
      - target: QingxinWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QINGXIN_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 清新签到
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: 清新签到
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        BGTaskSchedulerPermittedIdentifiers: [com.vel.qingxin.refresh]
        UIBackgroundModes: [fetch]
        QingxinAppGroup: $(APP_GROUP_IDENTIFIER)
        QingxinBootstrap: $(QINGXIN_BOOTSTRAP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [qingxin]
            CFBundleURLName: com.vel.qingxin
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
  QingxinWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    dependencies:
      - package: QingxinCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QINGXIN_BUNDLE_ID).widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: 清新签到课程
        QingxinAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
  QingxinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Qingxin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QINGXIN_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Qingxin
  QingxinAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Qingxin
      - package: QingxinCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QINGXIN_BUNDLE_ID).apptests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Qingxin:
    build:
      targets:
        Qingxin: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [QingxinAppTests, QingxinUITests]
    archive:
      config: Release
